# XcodeGen spec — the source of truth for VocabularyOS.xcodeproj.
# Regenerate with `xcodegen generate`; never edit the generated project by hand (ADR-006).
name: VocabularyOS

options:
  bundleIdPrefix: com.example.vocabularyos
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  VocabularyKit:
    path: Packages/VocabularyKit

targets:
  VocabularyOS:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - target: VocabularyOSShare
        destinationFilters: [iOS]
      - package: VocabularyKit
        product: VocabularyCore
      - package: VocabularyKit
        product: VocabularyAI
      - package: VocabularyKit
        product: VocabularyData
      - package: VocabularyKit
        product: VocabularyCapture
      - package: VocabularyKit
        product: VocabularySpeech
      - package: VocabularyKit
        product: VocabularyUI
    settings:
      base:
        PRODUCT_NAME: VocabularyOS
        PRODUCT_BUNDLE_IDENTIFIER: $(VOS_BUNDLE_PREFIX)
        DEVELOPMENT_TEAM: $(VOS_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: $(VOS_CODE_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(VOS_CODE_SIGN_IDENTITY)
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": Config/Entitlements/iOS-$(VOS_ENTITLEMENTS).entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/Entitlements/macOS-$(VOS_ENTITLEMENTS).entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Vocabulary-OS
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphone*]": YES
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphone*]": YES
        "INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphone*]": YES
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone[sdk=iphone*]": UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad[sdk=iphone*]": UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: ""  # the app icon arrives in T32
        SWIFT_VERSION: "6.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(VOS_SWIFT_CONDITIONS)
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  # Share extension (ADR-002): saves captures to the App Group inbox; the app imports them.
  VocabularyOSShare:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: Extensions/ShareExtension
        excludes:
          - Info.plist
      # Debug-only test support shared with the app.
      - path: App/Debug/StubGenerationClient.swift
      - path: App/Debug/ShareExtensionTestHooks.swift
    dependencies:
      - package: VocabularyKit
        product: VocabularyCore
      - package: VocabularyKit
        product: VocabularyAI
      - package: VocabularyKit
        product: VocabularyData
      - package: VocabularyKit
        product: VocabularyUI
    settings:
      base:
        PRODUCT_NAME: VocabularyOSShare
        PRODUCT_BUNDLE_IDENTIFIER: $(VOS_BUNDLE_PREFIX).share
        DEVELOPMENT_TEAM: $(VOS_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: $(VOS_CODE_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(VOS_CODE_SIGN_IDENTITY)
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/ShareExtension-iOS.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Extensions/ShareExtension/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Vocabulary-OS
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_VERSION: "6.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(VOS_SWIFT_CONDITIONS)
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  VocabularyOSUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: UITests
    dependencies:
      - target: VocabularyOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VOS_BUNDLE_PREFIX).uitests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: $(VOS_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: $(VOS_CODE_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(VOS_CODE_SIGN_IDENTITY)
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"

schemes:
  VocabularyOS:
    build:
      targets:
        VocabularyOS: all
        VocabularyOSUITests: [test]
    test:
      config: Debug
      targets:
        - VocabularyOSUITests
    run:
      config: Debug
    archive:
      config: Release
